{% extends 'base.html' %}{% block content %}
<section class="sf-welcome" aria-label="Welcome to SmartFit">
  <div class="sf-welcome-photo" aria-hidden="true"></div>
  <div class="sf-welcome-shade" aria-hidden="true"></div>
  <header class="sf-welcome-header">
    <a class="sf-welcome-brand" href="/" aria-label="SmartFit home"><span class="sf-welcome-brand-mark">S</span><span>Smart<span class="sf-welcome-accent">Fit</span></span></a>
    <span class="sf-welcome-header-note">YOUR FITNESS SPACE</span>
  </header>
  <div class="sf-welcome-copy">
    <p class="sf-welcome-kicker">MOVE WITH PURPOSE <span aria-hidden="true">/</span> GROW YOUR WAY</p>
    <h1><span class="sf-welcome-line sf-welcome-line-one">YOUR FITNESS.</span><span class="sf-welcome-line sf-welcome-line-two">YOUR <em>WAY.</em></span></h1>
    <p class="sf-welcome-description">Build your routine. Track your progress. Make every step count.</p>
    <nav class="sf-welcome-actions" aria-label="Get started">
      <a href="/auth?mode=signup" class="sf-welcome-button sf-welcome-primary">SIGN UP <span aria-hidden="true">↗</span></a>
      <a href="/auth?mode=login" class="sf-welcome-button sf-welcome-secondary">SIGN IN <span aria-hidden="true">→</span></a>
    </nav>
  </div>
  <footer class="sf-welcome-footer"><span>SMARTFIT / YOUR JOURNEY STARTS HERE</span><span>EST. 2026</span></footer>
</section>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap');
body.guest:has(.sf-welcome){background:#0d1010}
body.guest:has(.sf-welcome) .app-shell,body.guest:has(.sf-welcome) .page-content{overflow:visible}
.sf-welcome{isolation:isolate;position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:100vh;min-height:100svh;overflow:hidden;background:#101410;color:#fff;font-family:inherit}
.sf-welcome-photo,.sf-welcome-shade{position:absolute;inset:0;pointer-events:none;z-index:-1}
.sf-welcome-photo{background-image:url('https://unsplash.com/photos/ZlwCocz11D8/download?w=2400');background-size:cover;background-position:65% 45%;transform:scale(1.07);animation:sf-scene 14s ease-out both}
.sf-welcome-shade{background:linear-gradient(90deg,rgba(7,10,8,.82) 0%,rgba(7,10,8,.71) 38%,rgba(7,10,8,.24) 76%,rgba(7,10,8,.20) 100%),linear-gradient(0deg,rgba(5,8,6,.53),transparent 37%,rgba(5,8,6,.17))}
.sf-welcome-header,.sf-welcome-footer{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;max-width:1600px;margin:0 auto}
.sf-welcome-header{padding:32px clamp(24px,5vw,80px)}
.sf-welcome-brand{display:inline-flex;align-items:center;gap:10px;color:#fff;font-size:21px;font-weight:850;letter-spacing:-.7px}
.sf-welcome-brand-mark{display:grid;place-items:center;width:40px;height:40px;border:1px solid #fd777f77;background:#eb5063;color:white;border-radius:12px;font-size:24px}
.sf-welcome-accent{color:#f16a7b}
.sf-welcome-header-note,.sf-welcome-footer{font-size:11px;font-weight:750;letter-spacing:2px;color:#d9dfd9}
.sf-welcome-copy{width:min(710px,calc(100% - 48px));margin:auto auto auto clamp(24px,7vw,110px);padding:40px 0 72px;text-align:left}
.sf-welcome-kicker{margin:0 0 27px;color:#ff9da9;font-size:12px;font-weight:850;letter-spacing:3px;animation:sf-rise .85s .25s both}
.sf-welcome-kicker span{color:white;margin:0 12px}
.sf-welcome-copy h1{display:grid;gap:11px;margin:0;font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:clamp(50px,5.6vw,86px);line-height:1.08;letter-spacing:1px}
.sf-welcome-line{display:block;white-space:nowrap;animation:sf-rise .95s cubic-bezier(.22,1,.36,1) both}
.sf-welcome-line-one{animation-delay:.48s}
.sf-welcome-line-two{animation-delay:.8s}
.sf-welcome-line em{font-style:normal;color:#f36b7b}
.sf-welcome-description{max-width:480px;margin:31px 0 32px;color:#f0f2ef;font-size:clamp(15px,1.5vw,18px);line-height:1.55;animation:sf-rise .85s 1.13s both}
.sf-welcome-actions{display:flex;align-items:center;gap:15px;max-width:480px;animation:sf-rise .85s 1.4s both}
.sf-welcome-button{display:flex;align-items:center;justify-content:space-between;gap:25px;flex:1;min-height:58px;border:1px solid #ffffffbd;border-radius:8px;padding:16px 22px;font-weight:850;font-size:13px;letter-spacing:1.4px;transition:transform .2s ease,background-color .2s ease,box-shadow .2s ease}
.sf-welcome-button span{font-size:20px}
.sf-welcome-button:hover{transform:translateY(-3px)}
.sf-welcome-button:focus-visible{outline:3px solid #fff;outline-offset:4px}
.sf-welcome-primary{background:#e95165;border-color:#e95165;color:#fff}
.sf-welcome-primary:hover{background:#fc6679;box-shadow:0 10px 28px #f16a7b33}
.sf-welcome-secondary{background:#10131175;color:#fff;backdrop-filter:blur(5px)}
.sf-welcome-secondary:hover{background:#ffffff24}
.sf-welcome-footer{padding:0 clamp(24px,5vw,80px) 28px;animation:sf-fade .8s 1.7s both}
@keyframes sf-fade{from{opacity:0}to{opacity:1}}
@keyframes sf-rise{from{opacity:0;transform:translateY(31px)}to{opacity:1;transform:translateY(0)}}
@keyframes sf-scene{from{opacity:.65;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
@media(min-width:1450px){.sf-welcome-copy{margin-left:max(7vw,calc((100vw - 1450px)/2))}}
@media(max-width:800px){.sf-welcome-photo{background-position:62% center}.sf-welcome-shade{background:linear-gradient(0deg,rgba(5,9,7,.92) 0%,rgba(5,9,7,.68) 46%,rgba(5,9,7,.13) 100%)}.sf-welcome-copy{width:calc(100% - 48px);margin:auto 24px 6vh;text-align:left;padding:75px 0 25px}.sf-welcome-copy h1{font-size:clamp(43px,9.2vw,76px);letter-spacing:.5px}.sf-welcome-description{margin:23px 0}.sf-welcome-header-note{font-size:9px;letter-spacing:1px}}
@media(max-width:440px){.sf-welcome-header{padding:22px 20px}.sf-welcome-header-note{display:none}.sf-welcome-copy{width:calc(100% - 40px);margin-left:20px;margin-right:20px}.sf-welcome-copy h1{font-size:clamp(39px,10vw,52px);letter-spacing:0}.sf-welcome-kicker{font-size:10px;letter-spacing:1.5px}.sf-welcome-actions{gap:10px}.sf-welcome-button{min-height:54px;padding:14px;font-size:12px}.sf-welcome-footer{padding:0 20px 22px;font-size:9px;letter-spacing:1px}}
@media(prefers-reduced-motion:reduce){.sf-welcome *, .sf-welcome *::before,.sf-welcome *::after{animation:none!important;transition:none!important}.sf-welcome-photo{transform:none}}
</style>
{% endblock %}
