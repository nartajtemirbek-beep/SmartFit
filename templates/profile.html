{% extends 'base.html' %}{% block content %}<div class="intro"><div class="eyebrow">YOUR SPACE</div><h1>{% if p %}Edit your profile{% else %}Let's set up your profile{% endif %}</h1><p>These details are private and can be changed any time. Target weight is optional.</p></div><section class="panel narrow"><form action="/profile" method="post" class="gridform"><input type="hidden" name="token" value="{{csrf}}"><label>Display name<input name="display_name" maxlength="60" value="{{p.display_name if p else ''}}" required></label><label>Age<input type="number" name="age" min="13" max="110" value="{{p.age if p else ''}}" required></label><label>Height (cm)<input type="number" name="height_cm" min="100" max="250" step="0.1" value="{{p.height_cm if p else ''}}" required></label><label>Current weight (kg)<input type="number" name="current_weight_kg" min="20" max="350" step="0.1" value="{{p.current_weight_kg if p else ''}}" required></label><label>Target weight (kg) — optional<input type="number" name="target_weight_kg" min="20" max="350" step="0.1" value="{{p.target_weight_kg if p and p.target_weight_kg else ''}}"></label><label>Fitness goal<select name="fitness_goal">{% for x in ['General fitness','Build strength','Improve endurance','Improve flexibility','Stay active'] %}<option {% if p and p.fitness_goal==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Experience<select name="experience">{% for x in ['Beginner','Intermediate','Advanced'] %}<option {% if p and p.experience==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Training days / week<input type="number" name="training_days" min="1" max="7" value="{{p.training_days if p else 3}}" required></label><label>Equipment<select name="equipment">{% for x in ['Home','Gym','No equipment'] %}<option {% if p and p.equipment==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><button>Save my profile</button></form></section>{% endblock %}
