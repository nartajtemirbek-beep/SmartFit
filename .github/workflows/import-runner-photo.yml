name: Import selected runner photo
on:
  push:
    branches:
      - fix/embed-runner-image-locally
permissions:
  contents: write
jobs:
  import-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the public Unsplash image as a local file
        run: |
          python - <<'PY'
          import urllib.request,json,time,sys
          from pathlib import Path
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36','Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8'}
          photo='ZlwCocz11D8'
          urls=[]
          try:
              rq=urllib.request.Request('https://unsplash.com/napi/photos/'+photo,headers={**headers,'Accept':'application/json'})
              with urllib.request.urlopen(rq,timeout=25) as r:
                  obj=json.load(r)
              for key in ('full','regular','raw'):
                  url=(obj.get('urls') or {}).get(key)
                  if url: urls.append(url)
          except Exception as ex:
              print('Metadata fallback:',ex)
          urls += [
              'https://unsplash.com/photos/'+photo+'/download?force=true&w=2400',
              'https://unsplash.com/photos/runner-in-motion-on-a-street-'+photo+'/download?force=true&w=2400',
          ]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=40) as resp:
                      data=resp.read()
                      ct=resp.headers.get('Content-Type','')
                  print('Attempt',url[:110],ct,len(data))
                  if not ct.startswith('image/') or len(data)<30000:
                      continue
                  Path('/tmp/runner-original.jpg').write_bytes(data)
                  break
              except Exception as ex:
                  print('Download attempt error:',ex)
          else:
              raise SystemExit('Failed to download selected Unsplash photo')
          PY
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image,ImageOps
          from pathlib import Path
          im=Image.open('/tmp/runner-original.jpg').convert('RGB')
          if im.width<1300:raise SystemExit('Source image too small')
          im.thumbnail((2400,1600))
          path=Path('static/img/welcome-runner-felix.webp')
          path.parent.mkdir(parents=True,exist_ok=True)
          im.save(path,'WEBP',quality=85,method=6)
          print('Saved',path,im.size,path.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img/welcome-runner-felix.webp
          git commit -m "Add local runner photo for welcome screen"
          git push
